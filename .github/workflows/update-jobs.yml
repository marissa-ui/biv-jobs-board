# Refreshes jobs nightly and republishes the board via GitHub Pages.
name: Update jobs
on:
  push:
    branches: [main]
    paths:
      - companies.json
      - fetch_jobs.py
      - tests/**
      - .github/workflows/update-jobs.yml
  schedule:
    - cron: "0 6 * * *"   # daily, 6:00 UTC
  workflow_dispatch:        # manual "Run workflow" button
permissions:
  contents: write
concurrency:
  group: update-jobs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install "requests==2.34.2"
      - run: python -m unittest discover -s tests -v
      - run: python fetch_jobs.py
      - name: Report source errors
        run: |
          python - <<'PY'
          import json
          data = json.load(open("jobs.json"))
          errors = data.get("fetch_errors", [])
          if errors:
              print("::warning::" + str(len(errors)) + " source fetches failed; previous roles were retained where available.")
              for error in errors:
                  print("::warning::" + error)
          for key in ("stale_companies", "unverified_companies", "disabled_companies", "unsupported_companies"):
              names = data.get(key, [])
              if names:
                  print("::warning::" + key + ": " + ", ".join(names))
          PY
      - name: Commit updated jobs.json
        run: |
          total=$(python -c "import json; print(json.load(open('jobs.json'))['total_jobs'])")
          if [ "$total" -eq 0 ]; then
            echo "::warning::Fetched 0 jobs - keeping the previous jobs.json rather than publishing an empty board."
            git checkout -- jobs.json
            exit 0
          fi
          git config user.name "jobs-bot"
          git config user.email "actions@github.com"
          git add jobs.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Update jobs $(date -u +%F)"
          git pull --rebase --autostash
          git push
